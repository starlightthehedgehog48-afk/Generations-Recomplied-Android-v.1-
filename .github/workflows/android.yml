name: Build Android APK

on:
workflow_dispatch:
push:
branches:
- main

permissions:
contents: read

jobs:
build:
name: Build Sonic Generations APK
runs-on: ubuntu-latest

steps:
  - name: Download project
    uses: actions/checkout@v4

  - name: Install JDK 17
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Install Android SDK
    uses: android-actions/setup-android@v3

  - name: Install Android components
    run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

  - name: Install Gradle
    uses: gradle/actions/setup-gradle@v4
    with:
      gradle-version: '8.9'

  - name: Build APK
    shell: bash
    run: |
      set -e

      if [ -f settings.gradle.kts ]; then
        PROJECT_DIR="."
      elif [ -f SonicGenerationsCustom/settings.gradle.kts ]; then
        PROJECT_DIR="SonicGenerationsCustom"
      else
        echo "ERROR: Cannot find settings.gradle.kts"
        echo "Check where you uploaded your project files."
        exit 1
      fi

      cd "$PROJECT_DIR"
      gradle --no-daemon assembleDebug

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: SonicGenerationsCustom-APK
      path: |
        **/build/outputs/apk/debug/*.apk
      if-no-files-found: error
